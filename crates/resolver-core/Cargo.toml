[package]
name = "resolver-core"
version = "0.1.0"
description = "Reusable Douyin public share link resolver core"
edition = "2021"

[dependencies]
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
