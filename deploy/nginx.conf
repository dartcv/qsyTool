# Install as /etc/nginx/conf.d/qsy-resolver-api.conf.
# Replace every api.example.com occurrence before enabling this file.

limit_req_zone $binary_remote_addr zone=qsy_resolve_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=qsy_connections_per_ip:10m;

log_format qsy_json escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"}';

upstream qsy_resolver_api {
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QSYTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/qsy-resolver-api.access.log qsy_json;
    error_log /var/log/nginx/qsy-resolver-api.error.log warn;

    location = /healthz {
        proxy_pass http://qsy_resolver_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /api/v1/resolve {
        limit_except POST OPTIONS {
            deny all;
        }

        limit_req zone=qsy_resolve_per_ip burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        limit_conn qsy_connections_per_ip 10;
        limit_conn_status 429;

        proxy_pass http://qsy_resolver_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 25s;
        proxy_next_upstream off;
    }

    location / {
        default_type application/json;
        return 404 '{"code":"not_found","error":"Route not found","status":404}';
    }
}